<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 640" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b5a3a"/>
      <stop offset="50%" stop-color="#b79c63"/>
      <stop offset="100%" stop-color="#4b3d25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c76b"/>
      <stop offset="100%" stop-color="#7a6320"/>
    </linearGradient>
    <linearGradient id="cloth-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#d9dee4"/>

  <!-- 旗竿と先端 -->
  <rect x="52" y="60" width="16" height="560" rx="4" fill="url(#pole)" stroke="#2b2315" stroke-width="2"/>
  <polygon points="60,18 76,58 44,58" fill="url(#gold)" stroke="#2b2315" stroke-width="2"/>
  <circle cx="60" cy="62" r="9" fill="url(#gold)" stroke="#2b2315" stroke-width="2"/>

  <!-- 旗本体：黒地 -->
  <rect x="68" y="90" width="860" height="430" fill="#050505" stroke="#1a1a1a" stroke-width="3"/>
  <!-- 金縁 -->
  <rect x="84" y="106" width="828" height="398" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- 青い三菱マーク（左上）。位置は translate、大きさは scale で調整 -->
  <g transform="translate(190, 215) scale(1.7)" stroke="#050505" stroke-width="1.5" stroke-linejoin="miter">
    <polygon points="0,0 -34.64,-20 0,-40 34.64,-20" fill="#1e5bd6"/>
    <polygon points="0,0 34.64,-20 34.64,20 0,40" fill="#1e5bd6"/>
    <polygon points="0,0 0,40 -34.64,20 -34.64,-20" fill="#1e5bd6"/>
  </g>

  <!-- ★紋章はめ込み枠（中央）：ここに自分の紋章を入れる。使うとき点線の円は削除。
       入れ方の例（画像）：
       <image href="emblem.png" x="360" y="160" width="340" height="340"/>
  -->
  <g id="emblem-slot">
    <image href="emblem.png" x="360" y="160" width="340" height="340"/>
  </g>

  <!-- 布の陰影 -->
  <rect x="68" y="90" width="860" height="430" fill="url(#cloth-shade)"/>

  <!-- 房 -->
  <g fill="url(#gold)" stroke="#2b2315" stroke-width="1">
    <rect x="68" y="520" width="860" height="6"/>
    <polygon points="90,526 100,526 95,556"/><polygon points="150,526 160,526 155,556"/>
    <polygon points="210,526 220,526 215,556"/><polygon points="270,526 280,526 275,556"/>
    <polygon points="330,526 340,526 335,556"/><polygon points="390,526 400,526 395,556"/>
    <polygon points="450,526 460,526 455,556"/><polygon points="510,526 520,526 515,556"/>
    <polygon points="570,526 580,526 575,556"/><polygon points="630,526 640,526 635,556"/>
    <polygon points="690,526 700,526 695,556"/><polygon points="750,526 760,526 755,556"/>
    <polygon points="810,526 820,526 815,556"/><polygon points="870,526 880,526 875,556"/>
  </g>
</svg>
