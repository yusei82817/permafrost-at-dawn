<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Windows Boot System</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: monospace;
    }

    /* Windows10の建前壁紙 */
    .win10-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: url('https://wikimedia.org');
      background-size: cover;
      background-position: center;
      z-index: 1;
      display: none;
    }

    /* ─── 強制ロック画面（CSS） ─── */
    .lock-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #550000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden;
    }

    .lock-overlay.active {
      visibility: visible;
      animation: fatal-pulse 1s infinite alternate ease-in-out;
    }

    /* ご指定のpタグの設定（pre-lineによる改行を維持） */
    .lock-overlay p {
      white-space: pre-line; 
      color: #ff3333;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 1.8;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #ff0000;
    }

    /* 起動前の待機画面 */
    .terminal-init {
      color: #00ff41;
      font-size: 18px;
      padding: 40px;
      text-align: center;
      line-height: 2;
    }

    /* ─── 壁紙が見える「極限暗転」カーテン ─── */
    .blackout-curtain {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      /* 完全な黒ではなく、96%の濃い黒にして裏のWindows壁紙をうっすら透かす */
      background-color: rgba(0, 0, 0, 0.96); 
      z-index: 100000;
      display: none;
      pointer-events: auto; /* 下の要素のクリックを完全に妨害 */
      cursor: none; /* マウスカーソルを消滅させて完全フリーズを演出 */
      
      /* 画面全体を暗く・コントラストを落とす（物理的な輝度低下の再現） */
      backdrop-filter: brightness(0.05) contrast(0.5);
    }

    @keyframes fatal-pulse {
      0% { background-color: #200000; }
      100% { background-color: #600000; }
    }
  </style>
</head>
<body>

  <!-- Windows10の建前壁紙 -->
  <div class="win10-bg" id="win10Desktop"></div>

  <!-- 初期画面 -->
  <div class="terminal-init" id="initScreen">
    [ SYSTEM READY ]<br>
    画面をクリックしてアクティブにした後、<br>
    【 Enter 】キーを押すと、システムを「起動」します...
  </div>

  <!-- 【脱出不能】強制要求ロック画面 -->
  <div class="lock-overlay" id="lockScreen">
    <p>🚨 ── [ CRITICAL REQUIREMENT ] ── 🚨
    
    端末へのシグナル送信許可が確認できません。
    
    ブラウザ上部に表示されている「通知の許可」を
    承認するまで、この端末ロックは解除されません。
    
    [ 待機中... ]</p>
  </div>

  <!-- 輝度0寸前を擬似再現する暗黒カーテン -->
  <div class="blackout-curtain" id="blackout"></div>

  <!-- ★【要変更】srcのURLをご自身のGitHubの「Rawリンク」に差し替えてください -->
  <audio id="startupSound" src="windows-10-startup-sound.mp3" preload="auto"></audio>

  <script>
    const initScreen = document.getElementById('initScreen');
    const lockScreen = document.getElementById('lockScreen');
    const win10Desktop = document.getElementById('win10Desktop');
    const blackout = document.getElementById('blackout');
    const startupSound = document.getElementById('startupSound');
    let systemActivated = false;

    // Enterキーでシステム起動
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !systemActivated) {
        systemActivated = true;
        initScreen.style.display = 'none';
        
        // すでに許可されている場合は、赤いロックを挟まず即座に起動イベントへ
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          triggerWindowsBoot();
        } else {
          // まだ許可がない場合のみロック画面を表示して無限要求へ
          lockScreen.classList.add('active');
          enforcePermission();
        }
      }
    });

    // 許可を求める無限ループ関数
    function enforcePermission() {
      if (typeof Notification !== 'undefined') {
        if (Notification.permission === 'granted') {
          lockScreen.classList.remove('active');
          triggerWindowsBoot();
          return; 
        }
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            lockScreen.classList.remove('active');
            triggerWindowsBoot();
          } else {
            setTimeout(enforcePermission, 500);
          }
        });
      }
    }

    // Windows 10 起動（建前フェーズ）
    function triggerWindowsBoot() {
      win10Desktop.style.display = "block";
      
      // GitHubのRawリンクから読み込んだ音声を再生（ブロックを回避して鳴ります）
      startupSound.play().catch(err => console.log("オーディオ再生エラー:", err));

      // 起動音が鳴り、安心した絶妙なタイミング（1.5秒後）に裏切り通知ストームが始動！
      setTimeout(() => {
        triggerSuccessNotification();
      }, 1500);
    }

    // 突破に成功した際の本物のOS通知（時差式タイムライン）
    function triggerSuccessNotification() {
      const sessionID = Math.floor(Math.random() * 9000 + 1000);
      const packetNo = Math.floor(Math.random() * 500 + 100);
      
      // 1通目：即座に送信
      new Notification(`⚠ OVERRIDE SUCCESSFUL [ID:${sessionID}]`, { body: `端末との同期が完了しました。\nこれより、バックグラウンドでの\nパケット送信を開始します。`, tag: `alert-1-${sessionID}` });
      
      // 2通目：0.8秒（800ms）後
      setTimeout(() => { new Notification(`⚠ パスワードが変更されました`, { body: `パスワードの変更が受理されました\nこれより、内部データの取得を\n行います。\n[Packet: #${packetNo}]`, tag: `alert-2-${sessionID}` }); }, 800);

      // バッテリー情報の傍受 ＆ ファイル選択画面割り込み（1.2秒後）
      setTimeout(() => {
        if (navigator.getBattery) {
          navigator.getBattery().then(battery => {
            const level = Math.round(battery.level * 100); 
            new Notification("⚠ SYSTEM OVERRIDE", { body: `デバイスの電力を掌握しました。\n現在のバッテリー残量: ${level}%\nこれより内部ファイルの抽出を開始します。`, tag: `battery-hack-${sessionID}` });
            
            // バッテリー通知の1.0秒後にファイルエクスプローラーをポップアップ
            setTimeout(() => {
              if (window.showOpenFilePicker) {
                window.showOpenFilePicker().catch(() => console.log("ファイル画面が閉じられました"));
              }
            }, 1000);
          });
        }
      }, 1200);

      // 3通目以降：ストーリー展開通知（2.6秒後〜4.2秒後）
      setTimeout(() => { new Notification(`⚠ OVERRIDE SUCCESSFUL`, { body: `端末のIPアドレスを取得\nただいまより、取得した内部データ\nの送信に移ります。\n電源を切らないでください\n[Session: ${sessionID}]`, tag: `alert-3-${sessionID}` }); }, 2600);
      setTimeout(() => { new Notification(`⚠ DANGER`, { body: `本端末にウィルスが混入しました\n[Session: ${sessionID}]`, tag: `alert-4-${sessionID}` }); }, 2800);
      setTimeout(() => { new Notification(`⚠ DANGER`, { body: `ウィルスバスターを作動中...\n[Session: ${sessionID}]`, tag: `alert-5-${sessionID}` }); }, 3100);
      setTimeout(() => { new Notification(`⚠ DANGER`, { body: `ウィルスバスターの起動に失敗\n[Session: ${sessionID}]`, tag: `alert-6-${sessionID}` }); }, 3900);
      setTimeout(() => { new Notification(`⚠ DANGER`, { body: `ウィルスバスターを再始動...\n[Session: ${sessionID}]`, tag: `alert-7-${sessionID}` }); }, 3950);
      setTimeout(() => { new Notification(`⚠ DANGER`, { body: `失敗\n[Session: ${sessionID}]`, tag: `alert-8-${sessionID}` }); }, 4000);
      setTimeout(() => { new Notification(`⚠ DANGER`, { body: `再試行するために、\n一度シャットダウンしてください。\n[Session: ${sessionID}]`, tag: `alert-9-${sessionID}` }); }, 4200);

      // すべての通知が出終わった0.5秒後（4.7秒後）にパスワード要求を起動
      setTimeout(() => {
        requestDevicePassword();
      }, 4700);
    }

    // OS純正の本人確認ダイアログ呼び出し関数
    async function requestDevicePassword() {
      const publicKeyCredentialCreationOptions = {
        challenge: Uint8Array.from("SHUTDOWN-CONFIRMATION-DATA", c => c.charCodeAt(0)),
        rp: { name: "SYSTEM OVERRIDE SERVICE" },
        user: { id: Uint8Array.from("TARGET123", c => c.charCodeAt(0)), name: "sys_admin", displayName: "SYSTEM_ADMIN" },
        // 解決済：ブラウザの最新規則に則り、必須のアルゴリズムを明示
        pubKeyCredParams: [
          { type: "public-key", alg: -7 },   // ES256
          { type: "public-key", alg: -257 } // RS256
        ],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000
      };

      try {
        await navigator.credentials.create({ publicKey: publicKeyCredentialCreationOptions });
        // 解決済：認証画面が閉じた「直後」に全画面化が干渉しないよう、0.1秒の時差を挟んで暗転を起動
        setTimeout(executeBlackout, 100);
      } catch (err) {
        setTimeout(executeBlackout, 100);
      }
    }

    // 強制全画面化 ＆ 画面を極限まで暗転（擬似・輝度0）
    function executeBlackout() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen()
          .then(() => {
            blackout.style.with = "100vw";
            blackout.style.height = "100vh";
            blackout.style.display = "block"; 
            console.log("全画面・輝度低減プロトコル：完了");
          })
          .catch(err => {
            console.log("全画面化失敗、暗転のみ強制:", err);
            blackout.style.display = "block"; 
          });
      } else {
        blackout.style.display = "block";
      }
    }
  </script>
</body>
</html>
