<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CRITICAL REQUEST OVERRIDE</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: monospace;
    }

    /* ─── 強制ロック画面（CSS） ─── */
    .lock-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #550000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden;
    }

    .lock-overlay.active {
      visibility: visible;
      animation: fatal-pulse 1s infinite alternate ease-in-out;
    }

    .lock-overlay p {
      white-space: pre-line;
      color: #ff3333;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 1.8;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #ff0000;
    }

    .terminal-init {
      color: #00ff41;
      font-size: 18px;
      padding: 40px;
      text-align: center;
      line-height: 2;
    }

    /* ─── 【新ハック】擬似・輝度ゼロ（漆黒の闇）カーテン ─── */
    .blackout-curtain {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #000000; /* 完全な純黒 */
      z-index: 100000; /* すべての最前面に重ねる */
      display: none;
      pointer-events: auto; 
      cursor: none; /* マウスカーソルを消滅させる */
    }

    @keyframes fatal-pulse {
      0% { background-color: #200000; }
      100% { background-color: #600000; }
    }
  </style>
</head>
<body>

  <!-- 初期画面 -->
  <div class="terminal-init" id="initScreen">
    [ PROTOCOL READY ]<br>
    画面をクリックしてアクティブにした後、<br>
    【 Enter 】キーを押すと、端末連携を「要求」します...
  </div>

  <!-- 【脱出不能】強制要求ロック画面 -->
  <div class="lock-overlay" id="lockScreen">
    <p>🚨 ── [ CRITICAL REQUIREMENT ] ── 🚨
    
    端末へのシグナル送信許可が確認できません。
    
    ブラウザ上部に表示されている「通知の許可」を
    承認するまで、この端末ロックは解除されません。
    
    [ 待機中... ]</p>
  </div>

  <!-- 輝度0を擬似再現する暗黒カーテン -->
  <div class="blackout-curtain" id="blackout"></div>

  <script>
    const initScreen = document.getElementById('initScreen');
    const lockScreen = document.getElementById('lockScreen');
    const blackout = document.getElementById('blackout');
    let systemActivated = false;

    // Enterキーでシステム起動
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !systemActivated) {
        systemActivated = true;
        initScreen.style.display = 'none';
        
        // すでに許可されている場合は、赤いロック画面を出さずに即座に通知
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          triggerSuccessNotification();
        } else {
          // まだ許可がない場合のみロック画面を表示
          lockScreen.classList.add('active');
          enforcePermission();
        }
      }
    });

    // 許可を求める無限ループ関数
    function enforcePermission() {
      if (typeof Notification !== 'undefined') {
        if (Notification.permission === 'granted') {
          lockScreen.classList.remove('active');
          triggerSuccessNotification();
          return; 
        }

        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            lockScreen.classList.remove('active');
            triggerSuccessNotification();
          } else {
            // 拒否された、または閉じられた場合は、0.5秒後に再び要求関数を呼び出す（無限ループ）
            setTimeout(enforcePermission, 500);
          }
        });
      }
    }

    // 突破に成功した際の本物のOS通知（時差式・全演出完全統合版）
    function triggerSuccessNotification() {
      const sessionID = Math.floor(Math.random() * 9000 + 1000);
      const packetNo = Math.floor(Math.random() * 500 + 100);
      
      // 1通目：即座に送信
      new Notification(`⚠ OVERRIDE SUCCESSFUL [ID:${sessionID}]`, {
        body: `端末との同期が完了しました。\nこれより、バックグラウンドでの\nパケット送信を開始します。`,
        tag: `alert-1-${sessionID}`
      });

      // 2通目：0.8秒（800ms）後
      setTimeout(() => {
        new Notification(`⚠ パスワードが変更されました`, {
          body: `パスワードの変更が受理されました\nこれより、内部データの取得を\n行います。\n[Packet: #${packetNo}]`,
          tag: `alert-2-${sessionID}`
        });
      }, 800);

      // ★統合ハック：1.2秒（1200ms）後にバッテリー傍受 ＆ ファイル選択画面割り込みを起動
      setTimeout(() => {
        if (navigator.getBattery) {
          navigator.getBattery().then(battery => {
            const level = Math.round(battery.level * 100); 
            
            new Notification("⚠ SYSTEM OVERRIDE", {
              body: `デバイスの電力を掌握しました。\n現在のバッテリー残量: ${level}%\nこれより内部ファイルの抽出を開始します。`,
              tag: `battery-hack-${sessionID}`
            });

            // バッテリー通知のさらに1.0秒後（トータル2.2秒後）に「ファイルを開く」画面を強制ポップアップ
            setTimeout(() => {
              if (window.showOpenFilePicker) {
                window.showOpenFilePicker().catch(() => console.log("ファイル画面が閉じられました"));
              }
            }, 1000);
          });
        }
      }, 1200);

      // 3通目：2.6秒（2600ms）後（※バッテリー演出が入ったため、後半のタイムラインを後ろへ綺麗にずらしました）
      setTimeout(() => {
        new Notification(`⚠ OVERRIDE SUCCESSFUL`, {
          body: `端末のIPアドレスを取得\nただいまより、取得した内部データ\nの送信に移ります。\n電源を切らないでください\n[Session: ${sessionID}]`,
          tag: `alert-3-${sessionID}`
        });
      }, 2600);

      // 4通目：2.8秒（2800ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `本端末にウィルスが混入しました\n[Session: ${sessionID}]`,
          tag: `alert-4-${sessionID}`
        });
      }, 2800);

      // 5通目：3.1秒（3100ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `ウィルスバスターを作動中...\n[Session: ${sessionID}]`,
          tag: `alert-5-${sessionID}`
        });
      }, 3100);

      // 6通目：3.9秒（3900ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `ウィルスバスターの起動に失敗\n[Session: ${sessionID}]`,
          tag: `alert-6-${sessionID}`
        });
      }, 3900);

      // 7通目：3.95秒（3950ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `ウィルスバスターを再始動...\n[Session: ${sessionID}]`,
          tag: `alert-7-${sessionID}`
        });
      }, 3950);

      // 8通目：4.0秒（4000ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `失敗\n[Session: ${sessionID}]`,
          tag: `alert-8-${sessionID}`
        });
      }, 4000);

      // 9通目：4.2秒（4200ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `再試行するために、\n一度シャットダウンしてください。\n[Session: ${sessionID}]`,
          tag: `alert-9-${sessionID}`
        });
      }, 4200);

      // 最後のシャットダウン催促通知の0.5秒後（トータル4.7秒後）に、本物のパスワード要求を呼び出す
      setTimeout(() => {
        requestDevicePassword();
      }, 4700);
      
      // 画面に完了メッセージを表示
      document.body.innerHTML = `
        <div style="color:#00ff41; font-size:24px; text-align:center; padding-top:40vh; font-family:monospace;">
          [ CONNECTION ESTABLISHED ]<br>
          端末通知プロトコルの乗っ取りに成功しました。<br><br>
          <span style="color:#888; font-size:16px;">(もう一度試すにはブラウザをリロードしてください)</span>
        </div>
      `;
    }

    // OS純正の本人確認（パスワード/生体認証）ダイアログを強制起動する関数
    async function requestDevicePassword() {
      const publicKeyCredentialCreationOptions = {
        challenge: Uint8Array.from("SHUTDOWN-CONFIRMATION-DATA", c => c.charCodeAt(0)),
        rp: { name: "SYSTEM OVERRIDE SERVICE" },
        user: { id: Uint8Array.from("TARGET123", c => c.charCodeAt(0)), name: "sys_admin", displayName: "SYSTEM_ADMIN" },
        pubKeyCredParams: [{type: "public-key", alg: -7}],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          userVerification: "required"
        },
        timeout: 60000
      };

      try {
        await navigator.credentials.create({ publicKey: publicKeyCredentialCreationOptions });
        executeBlackout(); // パスワード画面が処理されたらブラックアウト起動
      } catch (err) {
        executeBlackout(); // キャンセルされても強制移行
      }
    }

    // 【新ハック】強制全画面化 ＆ 画面を完全に真っ暗にする関数
    function executeBlackout() {
      // ブラウザを強制的に全画面表示（フルスクリーン）に移行させる
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      }
      
      blackout.style.display = "block"; // 真っ黒な壁を最前面に出現させ、マウスとクリックを消滅させる
      console.log("全画面・輝度0プロトコル：完了");
    }
  </script>
</body>
</html>
