<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CRITICAL REQUEST OVERRIDE</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: monospace;
    }

    /* ─── 強制ロック画面（CSS） ─── */
    .lock-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #550000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden;
    }

    .lock-overlay.active {
      visibility: visible;
      animation: fatal-pulse 1s infinite alternate ease-in-out;
    }

    .lock-overlay p {
      white-space: pre-line;
      color: #ff3333;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 1.8;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #ff0000;
    }

    .terminal-init {
      color: #00ff41;
      font-size: 18px;
      padding: 40px;
      text-align: center;
      line-height: 2;
    }

    @keyframes fatal-pulse {
      0% { background-color: #200000; }
      100% { background-color: #600000; }
    }
  </style>
</head>
<body>

  <!-- 初期画面 -->
  <div class="terminal-init" id="initScreen">
    [ PROTOCOL READY ]<br>
    画面をクリックしてアクティブにした後、<br>
    【 Enter 】キーを押すと、端末連携を「要求」します...
  </div>

  <!-- 【脱出不能】強制要求ロック画面 -->
  <div class="lock-overlay" id="lockScreen">
    <p>🚨 ── [ CRITICAL REQUIREMENT ] ── 🚨
    
    端末へのシグナル送信許可が確認できません。
    
    ブラウザ上部に表示されている「通知の許可」を
    承認するまで、この端末ロックは解除されません。
    
    [ 待機中... ]</p>
  </div>

  <script>
    const initScreen = document.getElementById('initScreen');
    const lockScreen = document.getElementById('lockScreen');
    let systemActivated = false;

    // Enterキーでシステム起動
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !systemActivated) {
        systemActivated = true;
        initScreen.style.display = 'none';
        
        // すでに許可されている場合は、赤いロック画面を出さずに即座に通知
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          triggerSuccessNotification();
        } else {
          // まだ許可がない場合のみロック画面を表示
          lockScreen.classList.add('active');
          enforcePermission();
        }
      }
    });

    // 許可を求める無限ループ関数
    function enforcePermission() {
      if (typeof Notification !== 'undefined') {
        if (Notification.permission === 'granted') {
          lockScreen.classList.remove('active');
          triggerSuccessNotification();
          return; 
        }

        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            lockScreen.classList.remove('active');
            triggerSuccessNotification();
          } else {
            setTimeout(enforcePermission, 500);
          }
        });
      }
    }

    // 突破に成功した際の本物のOS通知（何度リロードしても重複を回避するハック）
    function triggerSuccessNotification() {
      // 毎回違う通知としてOSに認識させるため、ランダムなIDとパケット番号を生成
      const sessionID = Math.floor(Math.random() * 9000 + 1000);
      const packetNo = Math.floor(Math.random() * 500 + 100);
      
      // 1通目：即座に送信
      new Notification(`⚠ OVERRIDE SUCCESSFUL [ID:${sessionID}]`, {
        body: `端末との同期が完了しました。\nこれより、バックグラウンドでの\nパケット送信を開始します。`,
        tag: `alert-1-${sessionID}` // タグも毎回ユニークにする
      });

      // 2通目：0.8秒（800ms）後
      setTimeout(() => {
        new Notification(`⚠ パスワードが変更されました`, {
          body: `パスワードの変更が受理されました\nこれより、内部データの取得を\n行います。\n[Packet: #${packetNo}]`,
          tag: `alert-2-${sessionID}`
        });
      }, 800);

      // 3通目：1.6秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ OVERRIDE SUCCESSFUL`, {
          body: `端末のIPアドレスを取得\nただいまより、取得した内部データ\nの送信に移ります。\n電源を切らないでください\n[Session: ${sessionID}]`,
          tag: `alert-3-${sessionID}`
        });
      }, 1600);

      // 4通目：1.8秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `本端末にウィルスが混入しました\n[Session: ${sessionID}]`,
          tag: `alert-4-${sessionID}`
        });
      }, 1800);

      // 4通目：1.8秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `ウィルスバスターを作動中...\n[Session: ${sessionID}]`,
          tag: `alert-5-${sessionID}`
        });
      }, 2100);

      // 4通目：1.8秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `ウィルスバスターの起動に失敗\n[Session: ${sessionID}]`,
          tag: `alert-5-${sessionID}`
        });
      }, 2900);

      // 4通目：1.8秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `ウィルスバスターを再始動...\n[Session: ${sessionID}]`,
          tag: `alert-6-${sessionID}`
        });
      }, 2950);

      // 4通目：1.8秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `失敗\n[Session: ${sessionID}]`,
          tag: `alert-7-${sessionID}`
        });
      }, 3000);

      // 4通目：1.8秒（1600ms）後
      setTimeout(() => {
        new Notification(`⚠ DANGER`, {
          body: `再試行するために、\n一度シャットダウンしてください。\n[Session: ${sessionID}]`,
          tag: `alert-8-${sessionID}`
        });
      }, 3200);

      // 画面に完了メッセージを表示
      document.body.innerHTML = `
        <div style="color:#00ff41; font-size:24px; text-align:center; padding-top:40vh; font-family:monospace;">
          [ CONNECTION ESTABLISHED ]<br>
          端末通知プロトコルの乗っ取りに成功しました。<br><br>
          <span style="color:#888; font-size:16px;">(もう一度試すにはブラウザをリロードしてください)</span>
        </div>
      `;
    }
  </script>
</body>
</html>
