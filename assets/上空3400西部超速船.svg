<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- 高度3400mの超高空・極寒グラデーション -->
    <linearGradient id="stratosphere-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8f2ff"/>
      <stop offset="40%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#0b1b3d"/>
    </linearGradient>

    <!-- 西部超速線の鋭利なアフターバーナー／エネルギーライン -->
    <linearGradient id="west-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="50%" stop-color="#ff4b2b"/>
      <stop offset="100%" stop-color="#8a0022"/>
    </linearGradient>

    <!-- 車体・凍結フレームのアイスシルバー -->
    <linearGradient id="ice-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4f1f9"/>
      <stop offset="100%" stop-color="#6c8ca0"/>
    </linearGradient>
  </defs>

  <!-- 背景：ベースシールド（超高空の暗闇） -->
  <rect x="0" y="0" width="900" height="600" fill="#040812"/>

  <!-- 背景：高度3400mを象徴する急上昇する3重の軌道光線 -->
  <polygon points="0,520 900,100 900,125 0,545" fill="url(#west-crimson)" opacity="0.4"/>
  <polygon points="0,490 900,70 900,85 0,505" fill="url(#ice-silver)" opacity="0.8"/>
  <polygon points="0,460 900,40 900,50 0,470" fill="url(#stratosphere-blue)" opacity="0.5"/>

  <!-- 中央ロゴグループ -->
  <g transform="translate(450, 300)">
    
    <!-- 外郭：高高度推進リング（よりシャープな8角型ヘキサゴン） -->
    <polygon points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110" fill="none" stroke="url(#stratosphere-blue)" stroke-width="3" stroke-dasharray="80, 15"/>
    <polygon points="0,-200 170,-100 170,100 0,200 -170,100 -170,-100" fill="none" stroke="url(#ice-silver)" stroke-width="1" opacity="0.3"/>

    <!-- 「W（WEST）」と超速船のノーズを模した巨大V字ブレード -->
    <polygon points="-240,60 -180,60 0,-140 180,60 240,60 0,-190" fill="url(#west-crimson)"/>

    <!-- メイン車体シルエット（高度3400仕様の極高空超速船） -->
    <polygon points="-190,90 90,-90 230,-90 70,-30 -80,90" fill="url(#ice-silver)"/>
    <polygon points="-190,90 90,-90 230,-90 50,-50" fill="#ffffff"/> <!-- 陽光の反射ハイライト -->

    <!-- 高度表示「ALT. 3400」ダイナミック刻印 -->
    <path id="curve-path-3400" d="M -180,-90 A 210,210 0 0,1 180,-90" fill="none"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-style="italic" fill="url(#stratosphere-blue)" letter-spacing="4">
      <textPath href="#curve-path-3400" startOffset="50%" text-anchor="middle">ALT. 3400</textPath>
    </text>

    <!-- 下部：路線名「西部超速船」ロゴプレート -->
    <polygon points="-230,135 230,135 200,190 -200,190" fill="#0b1b3d" stroke="url(#west-crimson)" stroke-width="3"/>
    
    <text x="0" y="165" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="10" text-anchor="middle">
      西部超速船
    </text>
    <text x="0" y="182" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="url(#stratosphere-blue)" letter-spacing="4" text-anchor="middle">
      WESTERN EXPRESS SKY-LINE
    </text>

    <!-- 衝撃波・高空クライム（鋭い上昇ライン） -->
    <line x1="160" y1="-120" x2="270" y2="-190" stroke="url(#west-crimson)" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="-100" x2="280" y2="-150" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
