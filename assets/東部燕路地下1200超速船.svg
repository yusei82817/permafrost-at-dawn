<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- 深層地下・岩盤の重厚なダークグラデーション -->
    <linearGradient id="deep-rock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1412"/>
      <stop offset="50%" stop-color="#0d0908"/>
      <stop offset="100%" stop-color="#030202"/>
    </linearGradient>

    <!-- 地熱・マグマ・発光軌道を象徴するアンバーオレンジ -->
    <linearGradient id="swallow-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#991100"/>
    </linearGradient>

    <!-- 掘削刃・装甲フレームの深層スチール -->
    <linearGradient id="tunnel-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9c3b0"/>
      <stop offset="50%" stop-color="#736254"/>
      <stop offset="100%" stop-color="#261f1a"/>
    </linearGradient>
  </defs>

  <!-- 背景：地下深層の岩盤 -->
  <rect x="0" y="0" width="900" height="600" fill="url(#deep-rock)"/>

  <!-- 背景：地下トンネルを貫く超高速線路（リニアシールド） -->
  <polygon points="0,380 900,180 900,210 0,410" fill="url(#swallow-orange)" opacity="0.4"/>
  <polygon points="0,360 900,160 900,175 0,375" fill="url(#tunnel-steel)" opacity="0.6"/>

  <!-- 中央ロゴグループ -->
  <g transform="translate(450, 300)">
    
    <!-- 外郭：シールド掘削機（カッターヘッド）を思わせる重厚ギアリング -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="url(#tunnel-steel)" stroke-width="6"/>
    <circle cx="0" cy="0" r="185" fill="none" stroke="url(#swallow-orange)" stroke-width="3" stroke-dasharray="15, 10"/>

    <!-- 「燕（スワロー）」の尾羽と超速船を融合させた幾何学ブレード -->
    <!-- 燕の二股に分かれたシャープな尾羽シルエット -->
    <polygon points="-240,110 -120,-30 -160,-130 0,-70 160,-130 120,-30 240,110 0,20" fill="url(#swallow-orange)"/>

    <!-- 車体ノーズ（地下シールドを破る弾丸型ボディ） -->
    <polygon points="-180,80 80,-80 210,-80 60,-20 -90,80" fill="url(#tunnel-steel)"/>
    <polygon points="-180,80 80,-80 210,-80 40,-40" fill="#ffffff" opacity="0.8"/> <!-- ハイライト -->

    <!-- 深度表示「DEPTH -1200」刻印 -->
    <path id="curve-path-1200" d="M -180,-90 A 210,210 0 0,1 180,-90" fill="none"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-style="italic" fill="url(#swallow-orange)" letter-spacing="4">
      <textPath href="#curve-path-1200" startOffset="50%" text-anchor="middle">DEPTH -1200</textPath>
    </text>

    <!-- 下部：路線名「東部燕路地下超速船」ロゴプレート -->
    <polygon points="-260,135 260,135 220,195 -220,195" fill="#140b07" stroke="url(#swallow-orange)" stroke-width="3"/>
    
    <text x="0" y="165" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">
      東部燕路地下超速船
    </text>
    <text x="0" y="184" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="url(#tunnel-steel)" letter-spacing="3" text-anchor="middle">
      EASTERN SWALLOW-WAY UNDERGROUND EXPRESS
    </text>

    <!-- 火花・衝撃火炎（岩盤突破の演出） -->
    <line x1="150" y1="-100" x2="270" y2="-170" stroke="url(#swallow-orange)" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="-80" x2="280" y2="-130" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
