<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- 紋章の金色グラデーション -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89c"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#9a6e00"/>
    </linearGradient>
    
    <!-- 空上（飛行・高度）を象徴する翼のパーツ -->
    <g id="wing-wing">
      <path d="M 0,-10 C -20,-30 -60,-40 -110,-35 C -80,-15 -50,-5 -20,5 C -60,0 -90,10 -115,25 C -80,30 -40,30 -10,18 Z" fill="url(#gold)"/>
    </g>
  </defs>

  <!-- 背景：空上連邦のトリコロール（深紺・純白・高空シアン） -->
  <rect x="0" y="0" width="300" height="600" fill="#0b1e36"/>
  <rect x="300" y="0" width="300" height="600" fill="#f4f8fb"/>
  <rect x="600" y="0" width="300" height="600" fill="#1b4965"/>

  <!-- 中央のエンブレムグループ -->
  <g transform="translate(450, 300)">
    
    <!-- 外周の歯車（工業・連邦の団結） -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <g fill="url(#gold)">
      <!-- 歯車の突起（8箇所） -->
      <rect x="-12" y="-158" width="24" height="20" rx="3"/>
      <rect x="-12" y="138" width="24" height="20" rx="3"/>
      <rect x="-158" y="-12" width="20" height="24" rx="3"/>
      <rect x="138" y="-12" width="20" height="24" rx="3"/>
      <rect x="-115" y="-115" width="22" height="22" rx="3" transform="rotate(45)"/>
      <rect x="93" y="-115" width="22" height="22" rx="3" transform="rotate(45)"/>
      <rect x="-115" y="93" width="22" height="22" rx="3" transform="rotate(45)"/>
      <rect x="93" y="93" width="22" height="22" rx="3" transform="rotate(45)"/>
    </g>

    <!-- 中央背景の紺丸 -->
    <circle cx="0" cy="0" r="125" fill="#0b1e36" stroke="url(#gold)" stroke-width="4"/>

    <!-- 翼（左右対称） -->
    <use href="#wing-wing" transform="scale(-1, 1) translate(10, 20)"/>
    <use href="#wing-wing" transform="translate(10, 20)"/>

    <!-- 羅針盤・風の十字（航空技術） -->
    <polygon points="0,-110 12,-25 0,-35 -12,-25" fill="#ffffff"/>
    <polygon points="0,110 12,25 0,35 -12,25" fill="#ffffff"/>
    <polygon points="-110,0 -25,-12 -35,0 -25,12" fill="#ffffff"/>
    <polygon points="110,0 25,-12 35,0 25,12" fill="#ffffff"/>

    <!-- 主権を示す中央の金星 -->
    <polygon points="0,-30 8,-8 30,-8 12,5 18,26 0,12 -18,26 -12,5 -30,-8 -8,-8" fill="url(#gold)"/>
    
    <!-- 補足の小さな四角星（極地の空） -->
    <path d="M 0,-85 L 3,-70 L 18,-67 L 3,-64 L 0,-49 L -3,-64 L -18,-67 L -3,-70 Z" fill="#ffffff"/>
  </g>
</svg>
