<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- 高空の澄んだグラデーション -->
    <linearGradient id="sky-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#001e3d"/>
    </linearGradient>

    <!-- 超高速移動の光輝（流星・スピード感） -->
    <linearGradient id="speed-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>

    <!-- 車体・レールのサイバーシルバー -->
    <linearGradient id="rail-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
  </defs>

  <!-- 背景：ベースシールド -->
  <rect x="0" y="0" width="900" height="600" fill="#060b11"/>

  <!-- 背景を斜めに切り裂く高速レール・流線（インフラの躍動感） -->
  <polygon points="0,480 900,120 900,160 0,520" fill="url(#speed-gold)" opacity="0.3"/>
  <polygon points="0,450 900,90 900,105 0,465" fill="url(#rail-silver)" opacity="0.6"/>

  <!-- 中央ロゴグループ -->
  <g transform="translate(450, 300)">
    
    <!-- 外郭：高高度推進リング（環状構造） -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="url(#sky-blue)" stroke-width="4" stroke-dasharray="100, 20"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#rail-silver)" stroke-width="2" opacity="0.4"/>

    <!-- モノレールの軌道と「2800」を象徴する鋭角ウイング -->
    <polygon points="-260,100 180,-120 240,-120 -200,100" fill="url(#speed-gold)"/>

    <!-- メイン車体シルエット（超速船の鋭利なノーズ） -->
    <polygon points="-160,80 120,-60 220,-60 50,-10 -80,80" fill="url(#rail-silver)"/>
    <polygon points="-160,80 120,-60 220,-60 30,-30" fill="#ffffff"/> <!-- 車体ハイライト -->

    <!-- 高度表示「2800」ダイナミックテキストグラフィック -->
    <path id="curve-path" d="M -180,-80 A 200,200 0 0,1 180,-80" fill="none"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-style="italic" fill="url(#speed-gold)" letter-spacing="4">
      <textPath href="#curve-path" startOffset="50%" text-anchor="middle">ALT. 2800</textPath>
    </text>

    <!-- 下部：路線名「中部地方超速船」ロゴタイプ -->
    <!-- 枠線プレート -->
    <polygon points="-220,130 220,130 190,185 -190,185" fill="#001e3d" stroke="url(#sky-blue)" stroke-width="3"/>
    
    <text x="0" y="160" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">
      中部地方超速船
    </text>
    <text x="0" y="178" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="url(#speed-gold)" letter-spacing="4" text-anchor="middle">
      CHUBU EXPRESS SKY-LINE
    </text>

    <!-- スピード粒子 / 衝撃波（超音速巡航表現） -->
    <line x1="140" y1="-90" x2="280" y2="-160" stroke="url(#sky-blue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="170" y1="-70" x2="290" y2="-130" stroke="url(#speed-gold)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
