<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- 成層圏〜宇宙の境界（15800m）の漆黒・深空グラデーション -->
    <linearGradient id="space-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050c"/>
      <stop offset="60%" stop-color="#070e1b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- 北欧の天空を彩るオーロラグラデーション -->
    <linearGradient id="aurora-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#00ff75"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>

    <!-- 高度15800mの極光クリスタルゴールド -->
    <linearGradient id="nordic-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe699"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5c12"/>
    </linearGradient>

    <!-- 超高空の透明感あるスチール -->
    <linearGradient id="space-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#80a0c0"/>
    </linearGradient>
  </defs>

  <!-- 背景：宇宙に近い漆黒の空 -->
  <rect x="0" y="0" width="900" height="600" fill="url(#space-black)"/>

  <!-- 背景：流れるオーロラの光の帯（成層圏航路） -->
  <path d="M 0,200 Q 300,100 900,250 L 900,290 Q 300,140 0,240 Z" fill="url(#aurora-green)" opacity="0.25"/>
  <path d="M 0,380 Q 500,220 900,420 L 900,440 Q 500,240 0,400 Z" fill="url(#aurora-green)" opacity="0.15"/>

  <!-- 星々／極地の結晶（15800mの静寂） -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="80" r="1.5"/>
    <circle cx="780" cy="120" r="1"/>
    <circle cx="820" cy="480" r="2"/>
    <circle cx="120" cy="500" r="1"/>
  </g>

  <!-- 中央ロゴグループ -->
  <g transform="translate(450, 300)">
    
    <!-- 北欧の象徴：ノルディック・クロスの幾何学光輝リング -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="url(#aurora-green)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#nordic-gold)" stroke-width="4" stroke-dasharray="120, 30"/>

    <!-- 北欧クロス（クロスする十字線） -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="url(#nordic-gold)" stroke-width="2" opacity="0.5"/>
    <line x1="-80" y1="-240" x2="-80" y2="240" stroke="url(#nordic-gold)" stroke-width="2" opacity="0.5"/>

    <!-- 「15800m」超高空を跳び越えるハイパーソニック・ウイング -->
    <polygon points="-250,110 -150,-150 250,-150 180,-110 -110,-110 -180,110" fill="url(#aurora-green)" opacity="0.8"/>

    <!-- メイン車体シルエット（極高空・真空対応の流線型シャトルノーズ） -->
    <polygon points="-210,80 100,-100 240,-100 50,-20 -100,80" fill="url(#space-silver)"/>
    <polygon points="-210,80 100,-100 240,-100 30,-50" fill="#ffffff"/> <!-- 光の反射 -->

    <!-- 高度表示「ALT. 15800」刻印 -->
    <path id="curve-path-15800" d="M -180,-100 A 220,220 0 0,1 180,-100" fill="none"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-style="italic" fill="url(#nordic-gold)" letter-spacing="4">
      <textPath href="#curve-path-15800" startOffset="50%" text-anchor="middle">ALT. 15800</textPath>
    </text>

    <!-- 下部：路線名「北欧天空超速船」ロゴプレート -->
    <polygon points="-250,135 250,135 210,195 -210,195" fill="#040e1a" stroke="url(#aurora-green)" stroke-width="3"/>
    
    <text x="0" y="165" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="10" text-anchor="middle">
      北欧天空超速船
    </text>
    <text x="0" y="184" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="url(#nordic-gold)" letter-spacing="4" text-anchor="middle">
      NORDIC CELESTIAL SKY-LINE
    </text>

    <!-- 成層圏の超音速クリスタルライン -->
    <line x1="150" y1="-130" x2="280" y2="-200" stroke="url(#aurora-green)" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="-110" x2="290" y2="-160" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
