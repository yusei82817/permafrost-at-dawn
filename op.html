<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Permafrost at Dawn - OP Test</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#000;font:20px sans-serif;z-index:10;transition:opacity 1s}
#title{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;font-family:serif;opacity:0;transition:opacity 2s;pointer-events:none}
#title h1{margin:0;font-size:clamp(32px,6vw,96px);letter-spacing:.12em;white-space:nowrap}
#title p{margin:12px 0 0;font-size:clamp(12px,1.5vw,20px);letter-spacing:.3em}
#skip{position:fixed;right:20px;bottom:20px;padding:8px 14px;border:1px solid #ffffff66;background:#0008;color:#fff;cursor:pointer;z-index:20}
</style>
</head>
<body>
<div id="loading">Loading...</div>
<canvas id="renderCanvas"></canvas>
<div id="title"><h1>PERMAFROST AT DAWN</h1><p>THE WAR BEGINS</p></div>
<button id="skip">SKIP</button>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
const canvas=document.getElementById("renderCanvas");
const loading=document.getElementById("loading");
const title=document.getElementById("title");
const engine=new BABYLON.Engine(canvas,true);
let scene,camera,startTime;

async function createScene(){
  scene=new BABYLON.Scene(engine);
  camera=new BABYLON.FreeCamera("soldierCamera",new BABYLON.Vector3(0,1,-8),scene);
  camera.setTarget(new BABYLON.Vector3(0,1.2,5));

  const light=new BABYLON.HemisphericLight("light",new BABYLON.Vector3(0,1,0),scene);
  light.intensity=.65;

  const ground=BABYLON.MeshBuilder.CreateGround("ground",{width:100,height:100},scene);
  const gm=new BABYLON.StandardMaterial("groundMaterial",scene);
  gm.diffuseColor=new BABYLON.Color3(.075,.085,.06);\n  gm.specularColor=new BABYLON.Color3(.015,.015,.01);\n  gm.roughness=.95;
  ground.material=gm;

  // 実物の草.fbxを読み込む。前景に複製して兵士視点の遮蔽物にする。
  const grassRoot="https://raw.githubusercontent.com/yusei82817/permafrost-at-dawn/main/assets/";
  try{
    const result=await BABYLON.SceneLoader.ImportMeshAsync("",grassRoot,"草.fbx",scene);
    const sourceMeshes=result.meshes.filter(m=>m instanceof BABYLON.Mesh && m.name!=="__root__");
    if(sourceMeshes.length){
      // FBX/MTLが元PCのC:/パスを参照していても、OP側からテクスチャを強制指定する。
      const grassTexture=new BABYLON.Texture(grassRoot+"grass_green.jpg",scene);
      grassTexture.uScale=1;
      grassTexture.vScale=1;
      const grassMaterial=new BABYLON.StandardMaterial("opGrassMaterial",scene);
      grassMaterial.diffuseTexture=grassTexture;
      grassMaterial.diffuseColor=new BABYLON.Color3(1,1,1);
      grassMaterial.specularColor=new BABYLON.Color3(0.08,0.08,0.08);

      const sourceRoot=result.meshes[0];
      sourceRoot.setEnabled(false);
      const positions=[[-7,-2],[-5,0],[-7,3],[-4,5],[7,-2],[5,0],[7,3],[4,5],[-2,-4],[0,-4],[2,-4],[-8,7],[8,7]];
      positions.forEach((p,i)=>{
        const parent=new BABYLON.TransformNode("grassCluster_"+i,scene);
        parent.position.set(p[0]+(Math.random()-.5)*1.4,0,p[1]+(Math.random()-.5)*1.2);
        parent.rotation.y=Math.random()*Math.PI*2;
        const s=.65+Math.random()*.55;
        parent.scaling.set(s,s,s);
        for(const src of sourceMeshes){
          const clone=src.clone(src.name+"_clone_"+i,parent,true);
          if(clone){clone.material=grassMaterial;clone.setEnabled(true);}
        }
      });
    }
  }catch(error){
    console.warn("草.fbxの読み込みに失敗しました。仮草へフォールバックします。",error);
    const grassMat=new BABYLON.StandardMaterial("fallbackGrassMaterial",scene);
    grassMat.diffuseColor=new BABYLON.Color3(.12,.18,.08);
    for(let i=0;i<40;i++){
      const g=BABYLON.MeshBuilder.CreateBox("fallbackGrass",{width:.08,height:.8+Math.random()*.7,depth:.08},scene);
      g.position.x=(Math.random()-.5)*30;
      g.position.z=Math.random()*20-3;
      g.position.y=.4;
      g.rotation.y=Math.random()*Math.PI;
      g.material=grassMat;
    }
  }

  const distant=BABYLON.MeshBuilder.CreateBox("distantObject",{width:4,height:2,depth:6},scene);
  distant.position.set(0,1,14);
  const dm=new BABYLON.StandardMaterial("distantMaterial",scene);
  dm.diffuseColor=new BABYLON.Color3(.12,.12,.11);
  distant.material=dm;

  scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity=.009;
  scene.fogColor=new BABYLON.Color3(.16,.18,.17);\n  scene.clearColor=new BABYLON.Color4(.06,.08,.09,1);
  return scene;
}

function updateOpening(){
  const t=(performance.now()-startTime)/1000;
  camera.position.x=Math.sin(t*.7)*.015;
  camera.position.y=1+Math.sin(t*1.1)*.008;
  camera.setTarget(new BABYLON.Vector3(Math.sin(t*.15)*.5,1.15,5+t*.3));
  if(t>8) title.style.opacity="1";
}

async function start(){
  await createScene();
  loading.style.opacity="0";
  setTimeout(()=>loading.style.display="none",1000);
  startTime=performance.now();
  engine.runRenderLoop(()=>{updateOpening();scene.render()});
}

document.getElementById("skip").onclick=()=>{
  title.style.opacity="1";
  camera.position.set(0,1,-3);
  camera.setTarget(new BABYLON.Vector3(0,1.2,10));
};
window.addEventListener("resize",()=>engine.resize());
start();
</script>
</body>
</html>
